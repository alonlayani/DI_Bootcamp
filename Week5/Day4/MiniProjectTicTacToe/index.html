<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe vs AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Tic Tac Toe</h1>

  <div id="setup">
    <p>Choose your symbol:</p>
    <button class="symbol-btn" data-symbol="X">X</button>
    <button class="symbol-btn" data-symbol="O">O</button>

    <p>Choose the level:</p>
    <button class="level-btn selected" data-level="easy">Easy</button>
    <button class="level-btn" data-level="hard">Hard</button>
  </div>

  <div id="board">
    <div class="cell" id="0"></div>
    <div class="cell" id="1"></div>
    <div class="cell" id="2"></div>
    <div class="cell" id="3"></div>
    <div class="cell" id="4"></div>
    <div class="cell" id="5"></div>
    <div class="cell" id="6"></div>
    <div class="cell" id="7"></div>
    <div class="cell" id="8"></div>
  </div>

  <p id="message">Pick X or O to start</p>
  <button id="restart" hidden>Restart game</button>

  <script src="script.js"></script>
</body>
</html>
