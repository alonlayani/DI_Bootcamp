<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 1 - HTML Form (GET)</title>
</head>
<body>
  <!-- Exercise 1 : the form is submitted with the GET method -->
  <form action="exercise1.html" method="get">
    <label for="name">Name</label><br>
    <input type="text" id="name" name="name" size="20"><br><br>
    <label for="message">Message</label><br>
    <textarea id="message" name="message" rows="6" cols="40"></textarea><br><br>
    <input type="submit" value="Send">
  </form>

  <!--
    Where does the sent data appear?
    With GET, the data is appended to the URL as a query string, e.g.
    exercise1.html?name=John&message=Hello+world
    It is visible in the address bar (and in the browser history).
  -->
</body>
</html>
