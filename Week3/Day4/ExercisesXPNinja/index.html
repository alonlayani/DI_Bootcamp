<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Week 3 - Day 4 - Exercises XP Ninja</title>
  <style>
    #totalTip {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Exercise 1 : Calculate the tip -->
  <h2>Tip Calculator</h2>
  <p>How much was your bill? $<input id="billAmt" type="text" placeholder="Bill Amount"></p>
  <p>How was your service?
    <select id="serviceQual">
      <option disabled selected value="0">-- Choose an Option --</option>
      <option value="0.3">30% - Outstanding</option>
      <option value="0.2">20% - Good</option>
      <option value="0.15">15% - It was OK</option>
      <option value="0.1">10% - Bad</option>
      <option value="0.05">5% - Terrible</option>
    </select>
  </p>
  <p>How many people are sharing the bill? <input id="numOfPeople" type="text" placeholder="Number of People"></p>
  <button id="calculate">Calculate!</button>
  <div id="totalTip">
    <sup>$</sup><span id="tip">0.00</span>
    <small id="each">each</small>
  </div>

  <hr>

  <!-- Exercise 2 : Validate the email -->
  <form id="emailForm">
    <input type="email" id="email" placeholder="Your email">
    <input type="submit" value="Check">
  </form>
  <p id="emailResult"></p>

  <hr>

  <!-- Exercise 3 : Geolocation -->
  <button id="geoBtn">Get my location</button>
  <p id="geoResult"></p>

  <script src="main.js"></script>
</body>
</html>
